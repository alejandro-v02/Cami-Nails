  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Background circle: warm cream -->
  <circle cx="24" cy="24" r="23" fill="#FBF3E8" stroke="#C9A24B" stroke-width="2" />

  <!-- Rose silhouette: abstract rose in gold/pink -->
  <g transform="translate(24,24)">
    <!-- Outer petals -->
    <ellipse cx="0" cy="-5" rx="9" ry="8" fill="#E8A6BF" opacity="0.85" />
    <ellipse cx="7" cy="3" rx="8" ry="7" fill="#E8A6BF" opacity="0.7" transform="rotate(30)" />
    <ellipse cx="-7" cy="3" rx="8" ry="7" fill="#E8A6BF" opacity="0.7" transform="rotate(-30)" />

    <!-- Inner petals -->
    <ellipse cx="0" cy="-3" rx="5" ry="5" fill="#C9678B" opacity="0.8" />
    <ellipse cx="4" cy="2" rx="5" ry="4.5" fill="#C9A24B" opacity="0.7" transform="rotate(20)" />
    <ellipse cx="-4" cy="2" rx="5" ry="4.5" fill="#C9A24B" opacity="0.7" transform="rotate(-20)" />

    <!-- Center bud -->
    <circle cx="0" cy="0" r="2.5" fill="#E9C874" opacity="0.9" />

    <!-- Small leaf -->
    <ellipse cx="10" cy="8" rx="4.5" ry="2.5" fill="#C9A24B" opacity="0.6" transform="rotate(40 10 8)" />
  </g>
</svg>
